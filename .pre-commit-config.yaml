# One committed configuration so no developer needs to remember
# separate format/lint commands (docs/development/07_DEVELOPMENT_
# ENVIRONMENT.md §7.9). Install once per clone:
#
#   pip install pre-commit
#   pre-commit install
#
# After that, `git commit` runs these hooks automatically. This is
# convenience, not enforcement: a hook can be skipped with
# `git commit --no-verify`, or never installed at all. CI
# (.github/workflows/ci.yml) re-runs the same checks on every push/PR
# and is the actual, non-bypassable enforcement.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: [-i]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: \.md$
        args: [--prose-wrap=preserve]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]

# Vale (English prose linting) is intentionally not enabled here yet --
# it needs a styles/ directory and a house style pack (e.g. an
# ASD-STE100-oriented Vale config) that this repository does not have
# configured. Add it as a hook once that setup exists, matching the
# `markdownlint`/Vale split docs/development/07_DEVELOPMENT_ENVIRONMENT.md
# describes: markdownlint catches structural Markdown problems,
# Vale would catch prose-style problems.
